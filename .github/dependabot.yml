version: 2

# The pinned action versions (`actions/checkout@v7`, …) and the Rust toolchain pin are deliberate, so
# updates are proposed as reviewable pull requests rather than applied silently. Grouping keeps the
# noise to one PR per ecosystem per week.
updates:
  # The workflows and the composite setup action both pin third-party actions; the action's
  # directory has to be listed or its pins would never be proposed for update.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development

  # The native worker's workspace lives in `native/`, and its lockfile is what CI verifies with
  # `--locked`, so a dependency bump has to arrive as a lockfile change too.
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
