name: CI

# NOT RUNNING. Actions are disabled at repository level (Settings → Actions),
# so this file is documentation of the gate's design rather than a live gate.
# Nothing here runs on push, tag, schedule or manual dispatch.

# TWO JOBS, ON PURPOSE, AND NEITHER MAY STAND IN FOR THE OTHER.
#
#   hermetic     the whole gate on a machine with no FastCtx built from the
#                vendored source and no provisioned runtime. Fast, and the suites
#                that need a runtime SKIP — counted and printed as skipped, never
#                as passed — unless a platform payload supplies a binary, in
#                which case they run and say which runtime they hosted. (The
#                native Rust toolchain and the platform packages are both
#                present: the PTC worker and the Bash IPC proxies are built
#                below, and `npm ci` installs the payloads.)
#   integration  the same gate with a real runtime built from the vendored
#                source and DSH_OPS_REQUIRE_RUNTIME=1, which turns any skip into
#                a failure. This is the job that produces evidence about the
#                composition: mounting the plugin, hosting FastCtx, publishing
#                tools.
#
# Only `test/mount.test.mjs` needs a runtime today. It resolves one exactly the
# way the plugin does (config, `DSH_OPS_FASTCTX_BIN`, the managed runtime, the
# in-repo release build, this plugin's own platform package, `PATH`) and skips
# itself when there is none. To run that suite locally, build one:
#
#   cargo build --release --locked --manifest-path vendor/fastctx/Cargo.toml
#
# or point at a build you already have:
#
#   DSH_OPS_FASTCTX_BIN=<path to the fastctx executable> DSH_OPS_REQUIRE_RUNTIME=1 npm run verify
#
# PTC acceptance always builds the small independent worker; it never substitutes
# for the separate FastCtx integration evidence. This remains manual-only.
# A green hermetic run is not evidence about the FastCtx runtime, and the hermetic job
# ends by asserting that it really did skip the suite rather than quietly lose
# it.
# Automatic gates paused by the maintainer; existing suites remain opt-in.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    name: Gate without a FastCtx build
    runs-on: windows-latest
    env:
      # Explicit, so this job's meaning does not depend on the default.
      DSH_OPS_REQUIRE_RUNTIME: '0'
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Windows Bash IPC proxies
        # `test/bash-ipc.test.mjs` reads the receipt this leaves in runtime/, and runtime/ is
        # gitignored, so a fresh checkout has none — the suite then fails on the earlier refusal
        # instead of exercising the proxies it exists for.
        run: npm run build:bash-ipc

      - name: Set up native Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.97.1
          cache: false

      - name: Build the independent PTC worker (FastCtx remains absent)
        run: npm run build:ptc

      - name: Run the gate
        run: npm run verify

      - name: Assert the runtime suite reported its outcome rather than losing it
        # The failure this guards against is a gate that reports success about a suite it never ran.
        # `test/mount.test.mjs` skips itself (exit 77) when no runtime resolves, and runs when one
        # does. This job builds no FastCtx from source, but `npm ci` installs the platform payloads
        # and one of them can supply the binary, so both outcomes are legitimate here — what is not
        # legitimate is an unexplained third one.
        shell: pwsh
        run: |
          # Ask Node where its temporary directory is rather than choosing one for it: the harness
          # refuses a DSH_HOME outside `os.tmpdir()`, and on the hosted runner that is neither
          # `$env:RUNNER_TEMP` (a different drive: D:\a\_temp against C:\Users\RUNNER~1\...) nor
          # necessarily what `[System.IO.Path]::GetTempPath()` returns. Creating the directory with
          # the same call the harness compares against makes the two agree by construction.
          $staging = node -e "console.log(require('node:fs').mkdtempSync(require('node:path').join(require('node:os').tmpdir(),'dsh-ops-hermetic-')))"
          $env:DSH_HOME = $staging
          node test/mount.test.mjs
          $code = $LASTEXITCODE
          Remove-Item -Recurse -Force $staging
          if ($code -eq 77) {
            Write-Host 'mount skipped: no runtime resolved, which is this job''s premise'
            exit 0
          }
          if ($code -eq 0) {
            Write-Host 'mount ran and passed: a platform payload supplied a runtime, and the suite hosted it'
            exit 0
          }
          throw "expected the mount suite to skip (77) or pass (0) and say which, got exit $code"

  integration:
    name: Gate with the vendored FastCtx build
    runs-on: windows-latest
    env:
      # A skip here is a failure: this job exists to run what the hermetic one
      # cannot.
      DSH_OPS_REQUIRE_RUNTIME: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Set up the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          # Pinned rather than `stable`, for the same reason the release job pins
          # it: the vendored crate needs edition 2024 (rust-version 1.88), and a
          # gate should not change meaning when a toolchain moves.
          toolchain: 1.97.1
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build the Windows Bash IPC proxies
        run: npm run build:bash-ipc

      - name: Build the vendored FastCtx runtime
        run: cargo build --release --locked --manifest-path vendor/fastctx/Cargo.toml

      - name: Build the independent PTC worker
        run: npm run build:ptc

      - name: Run the gate (a skipped suite fails here)
        run: npm run verify

      - name: Show which runtime the integration suite hosted
        # Redundant with the gate above, deliberately: this prints the resolved
        # executable, its source rung, and its version, so two runs that
        # disagree about "the same" suite are visible in the log.
        run: node test/run.mjs mount
