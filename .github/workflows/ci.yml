name: Cross-platform validation
on:
  # A merge to `main` must validate itself. Without this, `main` was only ever checked when someone
  # remembered to dispatch the workflow by hand — which is how a stale number shipped in #134.
  push:
    branches: [main]
  # And a pull request has to show its result before it is merged, not after.
  pull_request:
    branches: [main]
  # A merge queue builds the queued commits before they reach `main`, and it only accepts a group
  # whose required checks passed there. Without this trigger the workflow simply never runs for a
  # queued group, so enabling a merge queue would silently un-gate every merge.
  merge_group:
  # An **opt-in** bench smoke. `inputs` is populated only for `workflow_dispatch`, and the job below
  # also names the event, so `push`, `pull_request` and `merge_group` runs skip it and stay exactly
  # as they were. Even when a human turns it on it is informational: `CI required` reports it and
  # never blocks on it, and the model-driven sweep is not run here at all.
  workflow_dispatch:
    inputs:
      bench:
        # Same-binary versus same-binary, so a green run means "the harness still drives a real
        # worker and the worker answers the same way twice" — never a performance verdict. The
        # comparison's state machine reads output hashes, error codes and harness failures only;
        # medians are printed and uploaded, never asserted.
        description: 'Also smoke the bench harness: the same staged worker on both sides, deterministic outcomes only'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cross-platform-${{ github.ref }}
  # A pull request that gets a new push supersedes its own earlier run; `main` never cancels,
  # because a half-built release branch is worse than a queued one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: win32-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: macos-latest, target: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '3'
      # Runners are shared and sometimes loaded: give each suite more headroom than a workstation
      # needs, and let a deadline be retried once — a timeout is the environment answering, and the
      # retry prints, so a green summary still shows it happened.
      DSH_OPS_SUITE_TIMEOUT_MS: '300000'
      DSH_OPS_RETRY_TIMEOUTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify runner identity
        run: node -e "if(process.platform+'-'+process.arch!=='${{ matrix.target }}')throw Error('Unexpected runner'); console.log(process.platform,process.arch)"
      - name: Set up pinned Rust
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Reuse exact locked Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ops-031-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock') }}
          # A changed lockfile must not throw the whole cache away: fall back to the previous one.
          restore-keys: ops-031-${{ runner.os }}-${{ runner.arch }}-
      - name: Linux ACL test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y acl
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Build and test native worker
        shell: bash
        run: |
          cargo test --locked --manifest-path native/Cargo.toml
          npm run build:ptc
      - name: Windows IPC build
        if: runner.os == 'Windows'
        run: npm run build:bash-ipc
      # The gate, not `npm run verify`: it runs the same suites with `DSH_OPS_REQUIRE_RUNTIME=1`
      # on POSIX (a runtime-absence skip is a failure, not a pass), refuses any skip outside this
      # platform's known set, fails when a suite file on disk was never collected, and checks the
      # packed artifact. Build success is not behaviour.
      - name: Functional gate (skips, suite inventory, packed artifact)
        shell: bash
        run: node scripts/verify-gate.mjs --skip-install
      - name: Verify native staged closure
        run: node bin/native-runtime.mjs check --platform ${{ matrix.target }}
      - name: Check shell payload platform filtering
        shell: bash
        run: node -e "const fs=require('fs');if(process.platform!=='win32'){for(const n of ['bash','pwsh'])if(fs.existsSync('node_modules/@dsh-ops/'+n+'-win32-x64'))throw Error('Windows shell installed on POSIX')}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: runtime/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  # The tools trial: one platform is enough, because it exercises the tool surface itself rather
  # than the platform. It is deliberately **not** required — `continue-on-error` keeps the run green
  # — so a tool that breaks shows up in its own job and in the uploaded report without blocking a
  # merge, while the `validate` matrix above stays the gate.
  tools-trial:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pinned Rust
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Reuse exact locked Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ops-031-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock') }}
          # A changed lockfile must not throw the whole cache away: fall back to the previous one.
          restore-keys: ops-031-${{ runner.os }}-${{ runner.arch }}-
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Build the native worker
        shell: bash
        run: npm run build:ptc
      # The trial owns a throwaway DSH_HOME under the system temp directory: the harness refuses to
      # run when it points elsewhere (the runner's `_temp` is not `os.tmpdir()`).
      - name: Try every published tool
        shell: bash
        run: node scripts/tools-trial.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tools-trial-report
          path: tools-trial-report.md
          if-no-files-found: warn
          retention-days: 7

  # The bench smoke: `workflow_dispatch` only, off by default, and informational (like `tools-trial`
  # above). One platform is enough, because it exercises the harness rather than the platform — the
  # three-OS matrix in `validate` is the gate. Both sides are the *same* staged worker, so the run
  # proves only what a harness self-check can prove: the corpus builds and is removed, the worker
  # answers identically twice, and every query lands on `MATCH` or a declared `EXPECTED_*`. It cannot
  # produce a performance verdict: `compare()` derives its state from output hashes, error codes and
  # harness failures, and the timings are printed as evidence. A real sweep drives a model and is
  # **never** run in CI.
  bench-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bench }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pinned Rust
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Reuse exact locked Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ops-031-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: ops-031-${{ runner.os }}-${{ runner.arch }}-
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Build the native worker
        shell: bash
        run: npm run build:ptc
      # The harness's deterministic half on its own: pure functions, node stand-ins and the
      # comparison's state machine. No model and no timing, so it is safe on a shared runner.
      - name: Harness deterministic suites
        run: node test/run.mjs bench
      # One binary on both sides, through the single cross-platform entry point (`bench/cli.mjs`).
      # The evidence lands under `bench/runs/` — the ignored evidence directory — so a hand-run of the
      # same command leaves the working tree clean too. `--scale 0.01` shrinks the file *counts* only:
      # the 33 MiB rejection, the 8 MiB hex window and the 1 MiB line boundaries are always present,
      # so a smoke still exercises every boundary. The watchdog is generous because a shared runner is
      # slow, not wrong.
      - name: Tool-level comparison, one binary on both sides
        shell: bash
        run: |
          worker="runtime/linux-x64/dsh-ops-worker"
          mkdir -p bench/runs/smoke/fixtures
          node bench/cli.mjs tools \
            --baseline "$worker" --candidate "$worker" \
            --out bench/runs/smoke/tools.json \
            --temp-dir bench/runs/smoke/fixtures \
            --scale 0.01 --timeout-ms 180000
      # Evidence, not a gate: `report.md` / `run.json` / `panel.html` are uploaded **when they exist**
      # (a tools-only smoke produces the comparison JSON and nothing else), so a dispatch that later
      # runs more of the harness still gets its report without failing on the files it did not make.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-smoke-report
          path: |
            bench/runs/smoke/**
            bench/runs/*/run.json
            bench/runs/*/report.md
            bench/runs/*/panel.html
          if-no-files-found: warn
          retention-days: 7

  # Static checks on the workflows themselves. Cheap, no Rust, nothing beyond the repository's own
  # dependencies: a workflow that quietly stops triggering — or stops blocking — is otherwise
  # invisible until someone merges something it was supposed to stop.
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Check workflow structure
        run: node scripts/check-workflows.mjs

  # `package.json` promises `^22.19 || >=24`, but the matrix above only ever runs 24, so the lower
  # bound was never exercised. One job on the declared floor keeps that promise honest without
  # tripling the platform matrix.
  node-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '3'
      DSH_OPS_SUITE_TIMEOUT_MS: '300000'
      DSH_OPS_RETRY_TIMEOUTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
      - name: Set up pinned Rust
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Build and test native worker
        shell: bash
        run: |
          cargo test --locked --manifest-path native/Cargo.toml
          npm run build:ptc
      - name: Functional gate (skips, suite inventory, packed artifact)
        shell: bash
        run: node scripts/verify-gate.mjs --skip-install

  # One check for a maintainer to require. Branch protection names individual job results, and the
  # matrix above expands into one check per platform, so requiring the gate means keeping three names
  # in sync — and silently losing the gate when a runner label changes. This job collapses them, and
  # it reports the deliberately non-blocking `tools-trial` and `bench-smoke` without letting either
  # fail the run. `bench-smoke` is listed in `needs` only so that this aggregate always accounts for
  # every job; it is deliberately absent from the loop below, which is the whole of its non-blocking
  # guarantee.
  ci-required:
    name: CI required
    if: always()
    needs: [validate, workflow-lint, node-floor, tools-trial, bench-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every blocking job succeeded
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for job in validate workflow-lint node-floor; do
            case "$job" in
              validate) result='${{ needs.validate.result }}' ;;
              workflow-lint) result='${{ needs.workflow-lint.result }}' ;;
              node-floor) result='${{ needs.node-floor.result }}' ;;
            esac
            echo "${job}: ${result}"
            [ "$result" = success ] || failed=1
          done
          echo "tools-trial: ${{ needs.tools-trial.result }} — informational: a broken tool shows up in its own job and report, it does not block a merge"
          echo "bench-smoke: ${{ needs.bench-smoke.result }} — informational: opt-in via the 'bench' dispatch input (skipped on push/pull_request/merge_group), it does not block a merge"
          if [ "$failed" != 0 ]; then
            echo "::error::a blocking job did not succeed; read the failing job above"
            exit 1
          fi
          echo "Every blocking job succeeded."
