name: Cross-platform validation
on:
  # A merge must validate itself. Without this, a branch was only ever checked when someone
  # remembered to dispatch the workflow by hand — which is how a stale number shipped in #134.
  # Release branches validate on push exactly like `main`; each 0.4.0 slice lands on its
  # staging branch before the final release PR.
  push:
    branches: [main, 0.3.2, release/0.4.0]
  # Every PR needs evidence, including stacked changes targeting a feature branch.
  # No target-branch or path filter: an omitted run cannot satisfy CI required.
  pull_request:
  # A merge queue builds the queued commits before they reach `main`, and it only accepts a group
  # whose required checks passed there. Without this trigger the workflow simply never runs for a
  # queued group, so enabling a merge queue would silently un-gate every merge.
  merge_group:
  # The bench smoke lives in `benchmark-gates.yml`: it is a measurement, never a merge gate, so it
  # is dispatched (or scheduled monthly) there instead of riding along on every PR.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-platform-${{ github.ref }}
  # A pull request that gets a new push supersedes its own earlier run; `main` never cancels,
  # because a half-built release branch is worse than a queued one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every job in this file is a gate: each one is in `ci-required`'s `needs`, and
# `scripts/check-workflows.mjs` asserts that no job can opt out (`EXPECTED_NON_BLOCKING` is
# empty). A job that is not deterministic enough to gate a merge does not belong in this workflow —
# the benchmark smoke is the one such job and it lives in `benchmark-gates.yml`.
#
# Toolchains come from `.github/actions/setup`: the Rust version is read from
# `native/rust-toolchain.toml`, so no workflow states it.
jobs:
  # One gate, four shipped targets. Per-leg budgets are measured, not guessed: Windows and Intel
  # take 9-14 minutes, the others about 4. A red leg is a real defect (DACL handling, Niubash
  # execution, the pack consumer), so every leg blocks the merge.
  validate:
    name: validate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The published Linux x64 worker is a musl static-pie binary so it carries no GLIBC_*
          # floor from the build runner. The gate stages it over the host worker before the suites,
          # so the suites exercise the binary users receive, not only a glibc build next to it.
          - { runner: ubuntu-24.04, target: linux-x64, timeout: 20, worker_target: x86_64-unknown-linux-musl }
          - { runner: macos-latest, target: darwin-arm64, timeout: 20 }
          - { runner: macos-15-intel, target: darwin-x64, timeout: 30 }
          - { runner: windows-latest, target: win32-x64, timeout: 30 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # Loaded runners get explicit deadline headroom; failures are never retried. The clean
      # Windows consumer includes cold artifact setup and frozen payload preparation, so this
      # matches the full-payload suite watchdog; production command limits remain unchanged.
      DSH_OPS_SUITE_TIMEOUT_MS: '300000'
    steps:
      - uses: actions/checkout@v7
        with:
          # The provenance regression verifies exact blobs from the pinned 0.3.1 commit.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          rust-targets: ${{ matrix.worker_target }}
      - name: Linux ACL test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y acl
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Native inherited control channel compatibility
        shell: bash
        run: |
          cargo test --locked --manifest-path native/Cargo.toml --example resident_probe
          cargo build --locked --manifest-path native/Cargo.toml --example resident_probe
          node bench/probes/probe-872-native.mjs
      # The gate, not `npm run verify`: it runs the same suites with `DSH_OPS_REQUIRE_RUNTIME=1`
      # on POSIX (a runtime-absence skip is a failure, not a pass), refuses any skip outside this
      # platform's known set, fails when a suite file on disk was never collected, checks the
      # staged and packed runtime closure, and refuses to run when the runner is not `--target`.
      # It builds the plugin before its CLI, then builds/tests the worker and Windows IPC proxies
      # using the pinned Bash payload installed by npm ci (or DSH_OPS_TEST_BASH).
      # Build success is not behaviour.
      - name: Functional gate (skips, suite inventory, packed artifact)
        shell: bash
        env:
          WORKER_TARGET: ${{ matrix.worker_target }}
        run: node scripts/verify-gate.mjs --skip-install --target ${{ matrix.target }} ${WORKER_TARGET:+--worker-target "$WORKER_TARGET"}
      - name: Resident blocked-request isolation
        shell: bash
        run: |
          cargo build --locked --manifest-path native/Cargo.toml --example resident_blocked
          node bench/probes/probe-872-isolation.mjs
      - name: Windows owned shell ranges and private channels
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked --manifest-path native/Cargo.toml --example shell_range --example shell_signal_fault
          cargo build --locked --manifest-path native/Cargo.toml -p ops-process --example shell_signal_cooperative
          node bench/probes/probe-872-shell-range.mjs
      - name: Windows shell driver supported stock boundary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --locked --manifest-path native/Cargo.toml --example shell_driver
          cargo build --locked --manifest-path native/Cargo.toml --example shell_driver
          node bench/probes/probe-872-shell-driver-direct.mjs native/target/debug/examples/shell_driver.exe runtime/win32-x64/niubash/niu.exe runtime/win32-x64/niubash/niu.exe --stock-contract
      - name: Windows resident shell queue cancellation and output backpressure
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked --manifest-path native/Cargo.toml --bin dsh-ops-worker --example shell_started_blocked
          node bench/probes/probe-872-shell-started.mjs native/target/debug/examples/shell_started_blocked.exe runtime/win32-x64/niubash/niu.exe runtime/win32-x64/niubash/niu.exe
          node bench/probes/probe-872-shell-backpressure.mjs native/target/debug/dsh-ops-worker.exe runtime/win32-x64/niubash/niu.exe lib/execution/resident/shell-bootstrap.js runtime/win32-x64/niubash/niu.exe
      - name: Assert the Linux worker is statically linked
        if: runner.os == 'Linux'
        shell: bash
        run: file runtime/linux-x64/dsh-ops-worker | grep -Eq 'statically linked|static-pie linked'
      # The UNC enumeration path needs a real UNC share. The Windows runner's
      # system drive is reachable through the C$ administrative share, so the
      # otherwise opt-in Rust regression runs in CI instead of staying local-only.
      - name: UNC directory regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\dsh-ops-unc' | Out-Null
          $env:DSH_OPS_UNC_TEST_ROOT = '\\localhost\C$\dsh-ops-unc'
          cargo test --locked --manifest-path native/Cargo.toml -p ops-search unc_directory -- --ignored --nocapture
      - name: Check shell payload platform filtering
        if: runner.os != 'Windows'
        shell: bash
        run: node -e "const fs=require('fs');for(const n of ['bash','pwsh'])if(fs.existsSync('node_modules/@dsh-ops/'+n+'-win32-x64'))throw Error('Windows shell installed on POSIX')"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: runtime/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  # The tools trial: one platform is enough, because it exercises the tool surface itself rather
  # than the platform. It is a gate: a published tool that cannot be called is a broken release.
  tools-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Build the plugin
        run: npm run build
      - name: Build the native worker
        shell: bash
        run: npm run build:ptc
      # The trial owns a throwaway DSH_HOME under the system temp directory: the harness refuses to
      # run when it points elsewhere (the runner's `_temp` is not `os.tmpdir()`).
      - name: Try every published tool
        shell: bash
        run: node scripts/tools-trial.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tools-trial-report
          path: tools-trial-report.md
          if-no-files-found: warn
          retention-days: 7

  # `package.json` promises `^22.19 || >=24`, but the legs above only ever run 24, so the lower
  # bound would never be exercised. The floor is a JavaScript-runtime property, so one host is
  # enough: the platform-specific behaviour is covered by the four validating legs on 24. Windows
  # on 22.19 is tracked separately (#774) because `niubash-consumer`, `pwsh-upgrade` and
  # `release-tar-modes` fail there (ETIMEDOUT / EPERM on npm-pack renames) while the same suites
  # pass on 24; adding that leg back is a follow-up, not a silent omission.
  node-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DSH_OPS_SUITE_TIMEOUT_MS: '300000'
    steps:
      - uses: actions/checkout@v7
        with:
          # The provenance regression verifies exact blobs from the pinned 0.3.1 commit.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: '22.19'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Functional gate (skips, suite inventory, packed artifact)
        shell: bash
        run: node scripts/verify-gate.mjs --skip-install

  # Static checks on the workflows themselves. Cheap, no Rust, nothing beyond the repository's own
  # dependencies: a workflow that quietly stops triggering — or stops blocking — is otherwise
  # invisible until someone merges something it was supposed to stop.
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Check workflow structure
        run: node scripts/check-workflows.mjs

  # The size gate: no tracked code file may cross a thousand lines. It needs no
  # dependencies and no Rust — `git ls-files` and the repository's own script are
  # the whole input — so it is its own job instead of a step in one of the heavier
  # ones, where its failure would be attributed to whatever that job is really
  # about.
  source-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
      - name: Check that every code file is at or under 1000 lines
        run: node scripts/check-file-size.mjs

  # Rust formatting and lints on every shipped OS family. The crates behind `#![cfg(windows)]` and
  # `cfg(target_os = "macos")` compile to nothing on Linux, so a Linux-only clippy never saw them
  # (it missed an `unreachable_code` error that only exists on macOS). `cargo clippy --target`
  # type-checks without linking, so the foreign targets need no extra runners and no C toolchain.
  rust-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust-components: rustfmt,clippy
          rust-targets: x86_64-pc-windows-msvc,aarch64-apple-darwin
      - name: rustfmt
        shell: bash
        run: cargo fmt --all --check --manifest-path native/Cargo.toml
      - name: clippy (linux, windows, macos)
        shell: bash
        run: >-
          cargo clippy --workspace --all-targets --locked --manifest-path native/Cargo.toml
          --target x86_64-unknown-linux-gnu --target x86_64-pc-windows-msvc --target aarch64-apple-darwin
          -- -D warnings

  # One check for a maintainer to require. Branch protection names individual job results, and the
  # `validate` matrix expands into one check per platform, so requiring the gate by hand means
  # keeping the names in sync — and silently losing the gate when a runner label changes. This job
  # collapses them.
  #
  # The verdict is computed from `needs` itself, so a job listed there is judged by construction:
  # it cannot be waited on and then forgotten in a second list. `scripts/check-workflows.mjs`
  # asserts `needs` against `EXPECTED_BLOCKING`, so a new job cannot be added without being
  # classified.
  ci-required:
    name: CI required
    if: always()
    needs: [validate, tools-trial, node-floor, workflow-lint, source-size, rust-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every blocking job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" >/dev/null; then
            echo "::error::a blocking job did not succeed; read the failing job above"
            exit 1
          fi
          echo "Every blocking job succeeded."
