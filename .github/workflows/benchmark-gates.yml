name: Opt-in OPS acceptance benchmarks

# Benchmarks are measurements, not merge gates: a shared runner's timing is noise, so nothing here
# blocks a pull request. The acceptance gates stay manual; the tool-level smoke also runs monthly so
# the harness is exercised on a schedule instead of only when someone remembers to dispatch it.
on:
  workflow_dispatch:
  schedule:
    # First of the month, 03:00 UTC. A measurement job never blocks a merge, so a monthly slot is
    # enough to catch a harness that stopped building its corpus or stopped answering identically.
    - cron: '0 3 1 * *'
permissions:
  contents: read
jobs:
  benchmark-gates:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: win32-x64, suffix: '.exe' }
          - { runner: ubuntu-24.04, target: linux-x64, suffix: '' }
          - { runner: macos-latest, target: darwin-arm64, suffix: '' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A measurement builds cold: no restored artifact can colour the numbers it reports.
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build candidate host
        run: npm run build
      - name: Acquire optional pinned Windows Bash fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'ops-benchmark-bash'
          node bin/dsh-ops.mjs bash-runtime install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = node --input-type=module -e "import {pinnedBashExecutable} from './lib/shells/pinned.js'; console.log(pinnedBashExecutable())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DSH_OPS_TEST_BASH=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build candidate worker
        run: npm run build:ptc
      - name: Materialize exact 0.3.1 source blobs
        run: node bench/gates/prepare-baseline.mjs baseline-031
      - name: Build independent 0.3.1 worker
        run: cargo build --release --locked --manifest-path baseline-031/native/Cargo.toml
      - name: Verify benchmark harness integrity
        run: node test/run.mjs bench-gates bench-integrity
      - name: Run all five real-host acceptance gates
        run: node bench/cli.mjs gates --baseline-source baseline-031 --baseline-worker baseline-031/native/target/release/dsh-ops-worker${{ matrix.suffix }} --output benchmark-gates.json
      - name: Upload exact evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-gates-${{ matrix.target }}
          path: |
            benchmark-gates.json
            benchmark-gates.json.md
          if-no-files-found: error
          retention-days: 30

  # The bench smoke, moved out of `ci.yml` when every job in that workflow became a merge gate.
  # Three host platforms exercise the portable harness; both sides are the *same* staged worker, so
  # the run proves only what a harness self-check can prove: the corpus builds and is removed, the
  # worker answers identically twice, and every query lands on `MATCH` or a declared `EXPECTED_*`.
  # It cannot produce a performance verdict: `compare()` derives its state from output hashes, error
  # codes and harness failures, and the timings are printed as evidence. A real sweep drives a model
  # and is **never** run here.
  bench-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            worker: dsh-ops-worker
          - os: windows-latest
            target: win32-x64
            worker: dsh-ops-worker.exe
          - os: macos-latest
            target: darwin-arm64
            worker: dsh-ops-worker
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v7
        with:
          # Included benchmark tests verify the pinned historical baseline.
          fetch-depth: 0
      # Only a push saves the cache, and this job runs on a schedule or by hand, so a cache here
      # could only ever be empty.
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Build the plugin
        run: npm run build
      - name: Build the native worker
        shell: bash
        run: npm run build:ptc
      # The harness's deterministic half on its own: pure functions, node stand-ins and the
      # comparison's state machine. No model and no timing, so it is safe on a shared runner.
      - name: Harness deterministic suites
        run: node test/run.mjs bench
      # One binary on both sides, through the single cross-platform entry point (`bench/cli.mjs`).
      # The evidence lands under `bench/runs/` — the ignored evidence directory — so a hand-run of
      # the same command leaves the working tree clean too. `--scale 0.01` shrinks the file *counts*
      # only: the 33 MiB rejection, the 8 MiB hex window and the 1 MiB line boundaries are always
      # present, so a smoke still exercises every boundary. The watchdog is generous because a shared
      # runner is slow, not wrong.
      - name: Tool-level comparison, one binary on both sides
        shell: bash
        run: |
          worker="runtime/${{ matrix.target }}/${{ matrix.worker }}"
          mkdir -p bench/runs/smoke/fixtures
          node bench/cli.mjs tools \
            --baseline "$worker" --candidate "$worker" \
            --out bench/runs/smoke/tools.json \
            --temp-dir bench/runs/smoke/fixtures \
            --scale 0.01 --timeout-ms 180000
      # Evidence, not a gate: `report.md` / `run.json` / `panel.html` are uploaded **when they
      # exist** (a tools-only smoke produces the comparison JSON and nothing else), so a dispatch
      # that later runs more of the harness still gets its report without failing on the files it
      # did not make. A comparison writes its default artifact into the sweep's group folder, named
      # `DSH-OPS Benchmark Report <UTC>.md`; the stamped name is globbed here as well as `report.md`
      # so an archive produced by either naming reaches the artifact.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-smoke-${{ matrix.target }}-report
          path: |
            bench/runs/smoke/**
            bench/runs/*/run.json
            bench/runs/*/report.md
            bench/runs/*/DSH-OPS Benchmark Report*.md
            bench/runs/*/panel.html
          if-no-files-found: warn
          retention-days: 7
