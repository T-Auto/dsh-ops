name: 缺陷报告
description: 报告一个可复现的缺陷（安装、诊断类问题请先看 troubleshooting 文档）
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先：

        1. 跑 `node <profile>/node_modules/dsh-ops/bin/dsh-ops.mjs ladder --json`（只读报告原生 worker 与两个 shell 的解析结果，不 spawn）；
        2. 查 [`docs/troubleshooting.md`](https://github.com/T-Auto/dsh-ops/blob/main/docs/troubleshooting.md)（中文：[`docs/常见问题.md`](https://github.com/T-Auto/dsh-ops/blob/main/docs/%E5%B8%B8%E8%A7%81%E9%97%AE%E9%A2%98.md)）；
        3. 若红的是测试套件，先确认环境前置——缺少 Rust 工具链（`ptc`）或 bash 载荷（`bash-ipc`）不是缺陷。

  - type: input
    id: dsh-ops-version
    attributes:
      label: dsh-ops 版本与安装通道
      placeholder: "例如 0.3.1（GitHub release）或 0.3.0（npm）；来源：registry.npmjs.org / 本地 tarball / dsh-ops provision-shells"
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本与 profile
      placeholder: "例如 DSH 0.2.0-rc.2，profile=desktop"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统与架构
      options:
        - Windows x64
        - Windows arm64
        - Linux x64
        - Linux arm64
        - macOS arm64
        - macOS x64
        - 其他（在下方说明）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 最小复现
      description: 可以直接照抄的命令或工具调用；包含完整入参。
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际读数
      description: 原始输出，不要转述。含报错文本、退出码、`ladder --json` 的相关字段。
      render: shell
    validations:
      required: true

  - type: dropdown
    id: isolation
    attributes:
      label: 是否在隔离环境复现过
      options:
        - 在隔离 profile / 临时 DSH_HOME 中复现
        - 只在真实 profile 中复现
        - 未尝试隔离
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他（可选）
      description: 相关 issue / PR、已排除的可能、代理或镜像环境等。
    validations:
      required: false
