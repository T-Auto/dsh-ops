[package]
name = "dsh-ops-windows-metadata"
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
windows-permissions = "=0.2.4"
winapi = { version = "0.3.9", features = ["processthreadsapi"] }
