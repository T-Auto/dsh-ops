[package]
name = "dsh-ops-core"
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dsh-ops-worker"
path = "src/main.rs"

[dependencies]
cap-std = "3.4"
cap-fs-ext = "3.4"
fs2 = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
sha2 = "0.10.9"
uuid = { version = "1.26", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

# OHOS: ships a cap-primitives with an openat2 guard (openat2 is killed by
# SIGSYS there, see vendor/cap-primitives/src/rustix/linux/fs/open_impl.rs).
[patch.crates-io]
cap-primitives = { path = "../vendor/cap-primitives" }
