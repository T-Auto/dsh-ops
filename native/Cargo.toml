[package]
name = "dsh-ops-core"
version = "0.4.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dsh-ops-worker"
path = "src/main.rs"

[dependencies]
cap-std = "3.4"
cap-fs-ext = "4.0"
serde_json = "1.0"
ops-protocol = { path = "crates/ops-protocol" }
ops-files = { path = "crates/ops-files" }
ops-documents = { path = "crates/ops-documents" }
ops-search = { path = "crates/ops-search" }
ops-results = { path = "crates/ops-results" }
ops-batch = { path = "crates/ops-batch" }

[lints.rust]
unsafe_code = "forbid"

[workspace]
members = ["windows-metadata", "darwin-metadata", "crates/*"]
resolver = "3"
