[package]
name = "ops-search"
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[dependencies]
ops-protocol = { path = "../ops-protocol" }
ops-files = { path = "../ops-files" }
cap-std = "3.4"
cap-fs-ext = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
sha2 = "0.10.9"

[dev-dependencies]
uuid = { version = "1.26", features = ["v4"] }
