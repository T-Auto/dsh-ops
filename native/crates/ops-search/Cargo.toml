[package]
name = "ops-search"
version = "0.5.0-alpha3"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[dependencies]
ops-protocol = { path = "../ops-protocol" }
ops-files = { path = "../ops-files" }
ops-index = { path = "../ops-index" }
cap-std = "3.4"
cap-fs-ext = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
sha2 = "0.10.9"

[dev-dependencies]
uuid = { version = "1.26", features = ["v4"] }

# The platform index sources are target-gated: each crate is itself
# `#![cfg(target_os = ...)]`, so only the matching one contributes code and the
# others are never built. `ops-search` names them; the pure `ops-index` crate
# stays free of platform dependencies.
[target.'cfg(windows)'.dependencies]
ops-win-index = { path = "../ops-win-index" }

[target.'cfg(target_os = "linux")'.dependencies]
ops-linux-index = { path = "../ops-linux-index" }

[target.'cfg(target_os = "macos")'.dependencies]
ops-mac-index = { path = "../ops-mac-index" }
