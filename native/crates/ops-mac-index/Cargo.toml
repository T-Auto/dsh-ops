[package]
name = "ops-mac-index"
version = "0.5.0-alpha3"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[dependencies]
ops-index = { path = "../ops-index" }

# The crate body starts with `#![cfg(target_os = "macos")]`, so the walk
# dependencies are target-gated as well: Linux and Windows workspace builds
# never resolve them into a compile unit. Keeping them out of `[dependencies]`
# is what makes that true for every target, not just the one this branch runs on.
[target.'cfg(target_os = "macos")'.dependencies]
# Sibling-directory recursion and per-entry stat fan-out for the cold path:
# #423 measured `symlink_metadata` at 71–87 % of a walk, which is the part
# worth parallelising. The traversal itself is `std::fs` only, by design.
rayon = "=1.12.0"
