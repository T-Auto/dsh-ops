[package]
name = "ops-results"
version = "0.4.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[dependencies]
ops-protocol = { path = "../ops-protocol" }
ops-files = { path = "../ops-files" }
cap-std = "3.4"
cap-fs-ext = "3.4"
fs2 = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
uuid = { version = "1.26", features = ["v4"] }
