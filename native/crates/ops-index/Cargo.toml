[package]
name = "ops-index"
version = "0.5.0-alpha3"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[dependencies]
# Advisory file lock for the snapshot writer. Already in the workspace lock
# through ops-files; fs2 0.4.3 was published 2018-01-06, well past the seven-day
# rule. This is the one whitelist exception (#584), required by #586.
fs2 = "=0.4.3"
# Canonical normalization for the fold key: APFS/HFS+ deliver NFD names while
# NTFS and ext4 deliver NFC, so the two spellings must match. Exact pin keeps
# MSRV 1.88 truthful; 0.1.26 was published 2026-10-16.
unicode-normalization = "=0.1.26"

[dev-dependencies]
# Property tests for the WTF-8 round trip and the decoder's totality over
# arbitrary bytes. Exact pin, published 2026-10-10; fork/timeout features are
# disabled on purpose so Windows CI spawns nothing.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
