[package]
name = "ops-documents"
version = "0.5.0-alpha2"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[dependencies]
ops-protocol = { path = "../ops-protocol" }
ops-files = { path = "../ops-files" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "=0.42.0", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
