# Four independent market components; no unconditional host executor override.
# Shell, file and idle-only automatic compaction are enabled by default.
# Background remains explicitly opt-in.
- insert:
    - id: dsh-ops-shell
      name: dsh-ops/shell
      config:
        promptPolicy: true
        publishBashTool: true
        shellPolicy: advise
        allowSystemShellFallback: true
    - id: dsh-ops-file
      name: dsh-ops/file
      config:
        promptPolicy: true
        enableShellTools: false
        required: false
        toolCallTimeoutMs: 300000
    - id: dsh-ops-background
      name: dsh-ops/background
      disabled: true
      config:
        promptPolicy: true
        enableShellTools: true
        required: false
        toolCallTimeoutMs: 300000
    - id: dsh-ops-auto-compact
      name: '@dsh-ops/auto-compact'
      config:
        thresholdPercent: 50
        cooldownSeconds: 120
        timeoutSeconds: 120
